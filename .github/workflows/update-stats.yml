name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate GitHub Stats Image
        run: |
          curl -o github-stats.svg "https://github-readme-stats.vercel.app/api?username=mahdi6992&show_icons=true&theme=tokyonight&hide_border=true&count_private=true"

      - name: Generate Top Languages Image
        run: |
          curl -o github-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=mahdi6992&layout=compact&theme=tokyonight&hide_border=true"

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add github-stats.svg github-langs.svg
          git commit -m "Update GitHub Stats [Auto]" || echo "No changes to commit"
          git push
